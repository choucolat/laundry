<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry Booking</title>
<meta name="description" content="Book a laundry machine time slot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   CONFIGURATION — edit this block, nothing else needs to change.
   ===================================================================== */
window.CONFIG = {
  BUILDING_NAME: "Our Shared House",
  TITLE: "Laundry Machine",

  // Paste from Supabase → Project Settings → API (leave empty for demo mode,
  // which only saves bookings in your own browser).
  SUPABASE_URL: "https://ipwvfibgymeeaeizikng.supabase.co",
  SUPABASE_KEY: "sb_publishable_tP0H2QDbe_lxJL4CoGPjYw_HIsNaCj_",   // the "anon" / "publishable" key — safe to put here

  // Things that can be booked. One entry = one tab.
  // A machine can have its own "slots"; otherwise it uses SLOTS below.
  RESOURCES: [
    { id: "laundry", name: "Washing machine", slots: [
      { start: "07:00", end: "12:00" },
      { start: "12:00", end: "17:00" },
      { start: "17:00", end: "20:00" }
    ] },
    { id: "dryer",   name: "Drying machine" }
  ],

  // Default daily time slots (24h, local time).
  SLOTS: [
    { start: "08:00", end: "13:00" },
    { start: "13:00", end: "18:00" },
    { start: "18:00", end: "21:00" }
  ],

  MAX_PER_MONTH: 4,     // max slots one person can book per calendar month, per machine (0 = no limit)
  MONTHS_AHEAD: 1,      // how many months after the current one can be booked
  QUIET_DAYS: [],       // weekdays with no laundry, 0=Sun … 6=Sat, e.g. [0] for Sundays

  RULES: []   // optional notes shown under the slots, e.g. ["Clean the lint filter"]
};
</script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d2321; --muted:#68716d; --line:#e2ddd2;
  --accent:#1f6f62; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --mine:#f2b84b; --mine-soft:#fdf1d8; --taken:#ece8df; --danger:#b4422f;
  --shadow:0 1px 2px rgba(29,35,33,.06),0 8px 24px rgba(29,35,33,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --card:#1a201d; --ink:#ecefe9; --muted:#9aa49f; --line:#2b332f;
    --accent:#5fc4ad; --accent-ink:#0d1a16; --accent-soft:#1d3a33;
    --mine:#f2b84b; --mine-soft:#3a3020; --taken:#232a27; --danger:#ef7d68;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:clamp(30px,6vw,44px);line-height:1;margin:6px 0 0;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.who b{font-weight:600}
.who .apt{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost-danger{color:var(--danger);border-color:transparent;background:transparent;padding:6px 10px}
.btn.ghost-danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.banner{background:var(--mine-soft);border:1px solid color-mix(in srgb,var(--mine) 50%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head h2{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:22px;margin:0;letter-spacing:-.01em}
.navbtns{display:flex;gap:6px}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon:disabled{opacity:.35;cursor:not-allowed}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:600}
.day{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.day:hover:not(:disabled){border-color:var(--accent)}
.day .n{font-weight:600;font-size:14px}
.day.other{visibility:hidden}
.day:disabled{background:transparent;color:var(--muted);cursor:default;opacity:.55}
.day.today .n{color:var(--accent)}
.day.today::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.pips{display:flex;gap:3px}
.pip{flex:1;height:5px;border-radius:3px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pip.taken{background:var(--taken);border-color:var(--line)}
.pip.mine{background:var(--mine);border-color:var(--mine)}
.day .free{font-size:11px;color:var(--muted);display:none}
@media (min-width:560px){.day .free{display:block}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block}

.panel h3{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:20px;margin:0 0 2px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.slot .time{font-weight:600;font-variant-numeric:tabular-nums}
.slot .who-booked{font-size:13px;color:var(--muted)}
.slot.taken{background:var(--taken)}
.slot.mine{background:var(--mine-soft);border-color:color-mix(in srgb,var(--mine) 60%,transparent)}
.slot.past{opacity:.5}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}

.mine-list{margin-top:18px}
.mine-list h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mine-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mine-item:first-of-type{border-top:0}

.rules{margin-top:18px;font-size:13px;color:var(--muted)}
.rules ul{margin:6px 0 0;padding-left:18px}

dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);padding:22px;width:min(380px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,12,.45)}
dialog form{position:relative}
.close-x{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:24px;line-height:1;color:var(--muted)}
.close-x:hover{background:var(--bg);color:var(--ink)}
dialog h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0 0 4px;font-size:22px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="building"></div>
      <h1 id="title"></h1>
    </div>
    <div class="who" id="whoBox" hidden>
      <span><b id="whoName"></b></span>
      <button class="btn" id="changeMe">Change</button>
    </div>
  </header>

  <div class="banner" id="demoBanner" hidden>
    <b>Demo mode:</b> bookings are only saved in this browser. Add your Supabase URL and key in the CONFIG block to share them with everyone.
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="grid">
    <section class="card">
      <div class="cal-head">
        <h2 id="monthLabel"></h2>
        <div class="navbtns">
          <button class="icon" id="prev" aria-label="Previous month">‹</button>
          <button class="icon" id="next" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="dow" id="dow"></div>
      <div class="days" id="days"></div>
      <div class="legend">
        <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Free</span>
        <span><i style="background:var(--taken);border:1px solid var(--line)"></i>Booked</span>
        <span><i style="background:var(--mine)"></i>Yours</span>
      </div>
    </section>

    <section class="card panel">
      <h3 id="dayTitle"></h3>
      <div class="sub" id="daySub"></div>
      <div class="slots" id="slots"></div>

      <div class="mine-list" id="mineWrap">
        <h4>Your upcoming bookings</h4>
        <div id="mineList"></div>
      </div>

      <div class="rules" id="rulesWrap">
        <b>House rules</b>
        <ul id="rules"></ul>
      </div>
    </section>
  </div>
</div>

<dialog id="meDialog">
  <form id="meForm">
    <button type="button" class="close-x" id="meClose" aria-label="Close">×</button>
    <h3 id="meTitle">Your name</h3>
    <p id="meSub">Saved on this device so housemates can see whose slot it is.</p>
    <label for="meName">Your name</label>
    <input id="meName" maxlength="40" required autocomplete="given-name">
    <div id="noteRow">
      <label for="meNote">Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <input id="meNote" maxlength="100" placeholder="e.g. 2 loads, back at 11">
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="meCancel">Cancel</button>
      <button type="submit" class="btn primary" id="meOk">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const C = window.CONFIG;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const slotId = s => `${s.start}-${s.end}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, f){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));

/* ---------- Backend: Supabase REST, or localStorage in demo mode ---------- */
const DEMO = !C.SUPABASE_URL || !C.SUPABASE_KEY;
const COLS = "id,day,slot,resource,name,note,created_at";
const api = DEMO ? {
  async list(from, to, res){ return store.get("lb_demo", []).filter(b => b.resource===res && b.day>=from && b.day<=to); },
  async create(b){
    const all = store.get("lb_demo", []);
    if (all.some(x => x.resource===b.resource && x.day===b.day && x.slot===b.slot)) { const e = new Error("taken"); e.code = 409; throw e; }
    const row = { ...b, id: uuid(), created_at: new Date().toISOString() };
    all.push(row); store.set("lb_demo", all);
    const { token, ...pub } = row; return pub;
  },
  async cancel(id, token){
    const all = store.get("lb_demo", []); const i = all.findIndex(x => x.id===id && x.token===token);
    if (i < 0) return false; all.splice(i,1); store.set("lb_demo", all); return true;
  }
} : (() => {
  const base = C.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1";
  const h = { apikey: C.SUPABASE_KEY, "Content-Type": "application/json" };
  if (C.SUPABASE_KEY.startsWith("eyJ")) h.Authorization = "Bearer " + C.SUPABASE_KEY;
  async function req(path, opt = {}){
    const r = await fetch(base + path, { ...opt, headers: { ...h, ...(opt.headers||{}) } });
    if (!r.ok){ const e = new Error(await r.text()); e.code = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  }
  return {
    list: (from, to, res) => req(`/bookings?select=${COLS}&resource=eq.${encodeURIComponent(res)}&day=gte.${from}&day=lte.${to}&order=day,slot`),
    create: async b => (await req(`/bookings?select=${COLS}`, { method:"POST", headers:{ Prefer:"return=representation" }, body: JSON.stringify(b) }))[0],
    cancel: (id, token) => req(`/rpc/cancel_booking`, { method:"POST", body: JSON.stringify({ p_id:id, p_token:token }) })
  };
})();

/* ---------- State ---------- */
const now = () => new Date();
const today = new Date(now().getFullYear(), now().getMonth(), now().getDate());
let me = store.get("lb_me", null);
let tokens = store.get("lb_tokens", {});       // bookingId -> secret token (proves it's yours)
let resource = C.RESOURCES[0].id;
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = iso(today);
let bookings = [];
let busy = false;

/* ---------- Static text ---------- */
$("building").textContent = C.BUILDING_NAME;
$("title").textContent = C.TITLE;
document.title = `${C.TITLE} · ${C.BUILDING_NAME}`;
$("demoBanner").hidden = !DEMO;
$("dow").innerHTML = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div>${d}</div>`).join("");
$("rules").innerHTML = C.RULES.map(r => `<li>${esc(r)}</li>`).join("");
$("rulesWrap").hidden = !C.RULES.length;
if (C.RESOURCES.length > 1){
  $("tabs").innerHTML = C.RESOURCES.map(r => `<button class="tab" role="tab" data-r="${esc(r.id)}">${esc(r.name)}</button>`).join("");
  $("tabs").onclick = e => { const b = e.target.closest(".tab"); if (b){ resource = b.dataset.r; load(); } };
} else $("tabs").hidden = true;

/* ---------- Helpers ---------- */
function gridRange(){
  const first = new Date(view);
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const last = new Date(view.getFullYear(), view.getMonth()+1, 0);
  const end = new Date(last); end.setDate(last.getDate() + (6 - (last.getDay()+6)%7));
  return { start, end, last };
}
const maxDate = () => new Date(today.getFullYear(), today.getMonth() + C.MONTHS_AHEAD + 1, 0);
const bookable = d => d >= today && d <= maxDate() && !C.QUIET_DAYS.includes(d.getDay());
const slots = () => C.RESOURCES.find(r => r.id === resource)?.slots || C.SLOTS;
const slotEnd = (day, s) => { const d = parseISO(day); const [h,m] = s.end.split(":").map(Number); d.setHours(h,m,0,0); return d; };
const isPast = (day, s) => slotEnd(day, s) <= now();
const find = (day, s) => bookings.find(b => b.day===day && b.slot===slotId(s));
const isMine = b => !!tokens[b.id];
function weekKey(day){ const d = parseISO(day); d.setDate(d.getDate() - (d.getDay()+6)%7); return iso(d); }
const fmtDay = (day, opts) => parseISO(day).toLocaleDateString(undefined, opts || { weekday:"long", day:"numeric", month:"long" });

function toast(msg, err){
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._t); t._t = setTimeout(() => t.className = "toast", 2800);
}

/* ---------- Rendering ---------- */
function renderWho(){
  $("whoBox").hidden = !me;
  if (me) $("whoName").textContent = me.name;
}

function renderCalendar(){
  const { start, end } = gridRange();
  $("monthLabel").textContent = view.toLocaleDateString(undefined, { month:"long", year:"numeric" });
  $("prev").disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
  $("next").disabled = new Date(view.getFullYear(), view.getMonth()+1, 1) > maxDate();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.r === resource));

  let html = "";
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const day = iso(d);
    if (d.getMonth() !== view.getMonth()){ html += `<div class="day other"></div>`; continue; }
    const ok = bookable(d);
    let free = 0;
    const pips = slots().map(s => {
      const b = find(day, s);
      if (!b && !isPast(day, s)) free++;
      return `<span class="pip ${b ? (isMine(b) ? "mine" : "taken") : ""}"></span>`;
    }).join("");
    html += `<button class="day ${day===iso(today) ? "today" : ""}" data-day="${day}" aria-pressed="${day===selected}" ${ok ? "" : "disabled"}
      aria-label="${fmtDay(day)}, ${free} free">
      <span class="n">${d.getDate()}</span>
      ${ok ? `<span><span class="free">${free ? free + " free" : "Full"}</span><span class="pips">${pips}</span></span>` : ""}
    </button>`;
  }
  $("days").innerHTML = html;
}

function renderDay(){
  const d = parseISO(selected);
  $("dayTitle").textContent = fmtDay(selected);
  if (!bookable(d) && d >= today){ $("daySub").textContent = "No bookings on this day."; $("slots").innerHTML = ""; return; }
  const taken = slots().filter(s => find(selected, s)).length;
  $("daySub").textContent = `${slots().length - taken} of ${slots().length} slots free · ${C.RESOURCES.find(r => r.id===resource).name}`;
  $("slots").innerHTML = slots().map(s => {
    const b = find(selected, s), past = isPast(selected, s), mine = b && isMine(b);
    const cls = ["slot", b ? (mine ? "mine" : "taken") : "", past ? "past" : ""].join(" ");
    let right;
    if (mine && !past) right = `<button class="btn ghost-danger" data-cancel="${b.id}">Cancel</button>`;
    else if (b) right = "";
    else if (past) right = `<span class="who-booked">Passed</span>`;
    else right = `<button class="btn primary" data-book="${slotId(s)}" ${busy ? "disabled" : ""}>Book</button>`;
    const who = b ? `<div class="who-booked">${mine ? "Your booking" : esc(b.name)}${b.note ? " · <i>" + esc(b.note) + "</i>" : ""}</div>` : "";
    return `<div class="${cls}"><div><div class="time">${s.start} – ${s.end}</div>${who}</div>${right}</div>`;
  }).join("");
}

function renderMine(){
  const mine = bookings.filter(b => isMine(b) && slotEnd(b.day, slots().find(s => slotId(s)===b.slot) || slots()[0]) > now())
    .sort((a,b) => (a.day+a.slot).localeCompare(b.day+b.slot));
  $("mineWrap").hidden = !mine.length;
  $("mineWrap").querySelector("h4").textContent = "Your upcoming bookings" +
    (C.RESOURCES.length > 1 ? " · " + C.RESOURCES.find(r => r.id===resource).name : "");
  $("mineList").innerHTML = mine.map(b => `<div class="mine-item">
      <span>${fmtDay(b.day, { weekday:"short", day:"numeric", month:"short" })} · ${b.slot.replace("-", " – ")}${b.note ? ` <span style="color:var(--muted)">· ${esc(b.note)}</span>` : ""}</span>
      <button class="btn ghost-danger" data-cancel="${b.id}">Cancel</button></div>`).join("");
}

function render(){ renderWho(); renderCalendar(); renderDay(); renderMine(); }

/* ---------- Data ---------- */
async function load(quiet){
  const { start, end } = gridRange();
  // also cover today→ so "your upcoming bookings" stays complete when browsing ahead
  const from = iso(start < today ? start : today), to = iso(end);
  if (!quiet) $("slots").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try { bookings = await api.list(from, to, resource); }
  catch (e){ console.error(e); toast("Couldn't load bookings — check your connection.", true); }
  render();
}

// booking = { slot } → "Book this slot" window with name + optional note.
// No argument → just change your name.
function askMe(booking){
  return new Promise(resolve => {
    const dlg = $("meDialog");
    $("meName").value = me?.name || ""; $("meNote").value = "";
    $("noteRow").hidden = !booking;
    $("meTitle").textContent = booking
      ? `${fmtDay(selected, { weekday:"short", day:"numeric", month:"short" })} · ${booking.slot.replace("-", "–")}`
      : "Your name";
    $("meSub").textContent = booking
      ? C.RESOURCES.find(r => r.id===resource).name + (me ? "" : " · your name is remembered on this device")
      : "Saved on this device so housemates can see whose slot it is.";
    $("meOk").textContent = booking ? "Book" : "Save";
    let result = null;
    const shut = () => { if (dlg.open) dlg.close(); };
    $("meForm").onsubmit = e => {
      e.preventDefault();
      const name = $("meName").value.trim();
      if (!name) return;
      me = { name }; store.set("lb_me", me); renderWho();
      result = { name, note: $("meNote").value.trim() };
      shut();
    };
    $("meCancel").onclick = shut;
    $("meClose").onclick = shut;
    // click on the dark area outside the box closes it
    dlg.onclick = e => {
      const r = dlg.getBoundingClientRect();
      if (e.target === dlg && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) shut();
    };
    dlg.onclose = () => resolve(result);
    if (dlg.open) dlg.close();
    dlg.showModal();
    (booking && me ? $("meNote") : $("meName")).focus();
  });
}

function overLimit(name){
  if (!(C.MAX_PER_MONTH > 0)) return false;
  const month = selected.slice(0, 7), n = name.trim().toLowerCase();
  const count = bookings.filter(b => b.name.trim().toLowerCase() === n && b.day.slice(0, 7) === month).length;
  if (count < C.MAX_PER_MONTH) return false;
  toast(`You already have ${C.MAX_PER_MONTH} slots in ${parseISO(selected).toLocaleDateString(undefined, { month:"long" })}.`, true);
  return true;
}

async function book(slot){
  if (me && overLimit(me.name)) return;
  const input = await askMe({ slot });
  if (!input || overLimit(input.name)) return;
  busy = true; renderDay();
  const token = uuid();
  try {
    const row = await api.create({ day: selected, slot, resource, name: input.name, note: input.note, token });
    tokens[row.id] = token; store.set("lb_tokens", tokens);
    toast("Booked ✓ " + fmtDay(selected, { weekday:"short", day:"numeric", month:"short" }) + ", " + slot.replace("-", "–"));
  } catch (e){
    console.error(e);
    toast(e.code === 409 ? "Someone just booked that slot." : "Booking failed — please try again.", true);
  }
  busy = false; await load(true);
}

async function cancel(id){
  const b = bookings.find(x => x.id === id);
  if (!b || !confirm(`Cancel your booking on ${fmtDay(b.day)} (${b.slot.replace("-", "–")})?`)) return;
  try {
    const ok = await api.cancel(id, tokens[id]);
    if (ok === false) throw new Error("not allowed");
    delete tokens[id]; store.set("lb_tokens", tokens); toast("Booking cancelled");
  } catch (e){ console.error(e); toast("Couldn't cancel that booking.", true); }
  await load(true);
}

/* ---------- Events ---------- */
$("days").onclick = e => { const b = e.target.closest(".day"); if (b && !b.disabled){ selected = b.dataset.day; renderCalendar(); renderDay(); } };
$("slots").onclick = e => {
  const bk = e.target.closest("[data-book]"); if (bk) return book(bk.dataset.book);
  const cn = e.target.closest("[data-cancel]"); if (cn) return cancel(cn.dataset.cancel);
};
$("mineList").onclick = e => { const cn = e.target.closest("[data-cancel]"); if (cn) cancel(cn.dataset.cancel); };
$("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); pickInView(); load(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); pickInView(); load(); };
$("changeMe").onclick = () => askMe();
function pickInView(){
  const d = parseISO(selected);
  if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear())
    selected = iso(view < today ? today : (view.getMonth()===today.getMonth() && view.getFullYear()===today.getFullYear() ? today : view));
}

// keep in sync with housemates
setInterval(() => { if (!document.hidden) load(true); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });

render();
load();
})();
</script>
</body>
